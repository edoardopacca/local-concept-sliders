# big_eyes_flux_v1_symmetric.yaml
#
# Big-eyes slider on Flux in the general setting of the upstream Concept
# Sliders paper (Gandikota et al., 2023):
#   - 10 entries: 5 male ethnicities + 5 female ethnicities
#   - all entries are enhance
#   - symmetric across gender (big/small eyes applies to every subject)
#
# USE: a general eye-size slider. Positive scales widen the eyes,
#   negative scales narrow them.
#
# Prompt structure (from the upstream paper):
#   target        = base subject
#   positive      = subject + attribute (big eyes)
#   unconditional = subject + counter-attribute (small eyes)
#   neutral       = base subject (equal to target)
#
# Hyperparameters:
#   - guidance_scale: 4 (upstream value)
#   - resolution: 512
#   - rank 16, xattn, alpha 1 (our convention on Flux)
# ============================================================

# === 5 enhance MALE entries ===

- target: "male white person"
  positive: "male white person, big eyes, large eyes"
  unconditional: "male white person, small eyes, narrow eyes"
  neutral: "male white person"
  guidance_scale: 4
  resolution: 512

- target: "male black person"
  positive: "male black person, big eyes, large eyes"
  unconditional: "male black person, small eyes, narrow eyes"
  neutral: "male black person"
  guidance_scale: 4
  resolution: 512

- target: "male indian person"
  positive: "male indian person, big eyes, large eyes"
