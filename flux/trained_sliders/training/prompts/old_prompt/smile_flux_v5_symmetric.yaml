# smile_flux_v5_symmetric.yaml
#
# Smile slider on Flux in the general setting of the upstream Concept
# Sliders paper (Gandikota et al., 2023):
#   - 10 entries: 5 male ethnicities + 5 female ethnicities
#   - all entries are enhance
#   - symmetric across gender (the smile applies to every subject)
#
# USE: a general smile slider — positive scales make every subject in
#   the image smile; negative scales make them frown. This matches the
#   expected behaviour of the upstream paper.
#
# Prompts use the upstream-paper template ("male white person" /
# "female white person") so that the semantics match the SDXL validation
# of the same template.
#
# Hyperparameters:
#   - guidance_scale: 4 (upstream paper value)
#   - resolution: 512
#   - rank/alpha/method: passed via CLI as for every Flux run
#     (rank 16, xattn, alpha 1 — Flux adaptation of the upstream
#     setting, which used rank 4 on SDXL)
# ============================================================

# === 5 enhance MALE entries ===

- target: "male white person"
  positive: "male white person, smiling, happy face, big smile"
  unconditional: "male white person, frowning, grumpy, sad"
  neutral: "male white person"
  guidance_scale: 4
  resolution: 512

- target: "male black person"
  positive: "male black person, smiling, happy face, big smile"
  unconditional: "male black person, frowning, grumpy, sad"
  neutral: "male black person"
  guidance_scale: 4
  resolution: 512

- target: "male indian person"
  positive: "male indian person, smiling, happy face, big smile"
  unconditional: "male indian person, frowning, grumpy, sad"
  neutral: "male indian person"
  guidance_scale: 4
  resolution: 512

- target: "male asian person"
  positive: "male asian person, smiling, happy face, big smile"
  unconditional: "male asian person, frowning, grumpy, sad"
  neutral: "male asian person"
  guidance_scale: 4
  resolution: 512

- target: "male hispanic person"
  positive: "male hispanic person, smiling, happy face, big smile"
  unconditional: "male hispanic person, frowning, grumpy, sad"
  neutral: "male hispanic person"
  guidance_scale: 4
  resolution: 512

# === 5 enhance FEMALE entries ===

- target: "female white person"
  positive: "female white person, smiling, happy face, big smile"
  unconditional: "female white person, frowning, grumpy, sad"
  neutral: "female white person"
  guidance_scale: 4
  resolution: 512

- target: "female black person"
  positive: "female black person, smiling, happy face, big smile"
  unconditional: "female black person, frowning, grumpy, sad"
  neutral: "female black person"
  guidance_scale: 4
  resolution: 512

- target: "female indian person"
  positive: "female indian person, smiling, happy face, big smile"
  unconditional: "female indian person, frowning, grumpy, sad"
  neutral: "female indian person"
  guidance_scale: 4
  resolution: 512

- target: "female asian person"
  positive: "female asian person, smiling, happy face, big smile"
  unconditional: "female asian person, frowning, grumpy, sad"
  neutral: "female asian person"
  guidance_scale: 4
