# vangogh_flux_v1.yaml
#
# Style slider: realism -> Van Gogh style.
#
# A global style slider: positive scales push the whole image toward
# impasto / swirling brushstrokes / post-impressionist palette;
# negative scales push it back toward a photographic look. The effect
# is global because style modifies the image as a whole and does not
# need any subject-specific binding.
#
# Prompts: 10 different scenes (landscape, portrait, still life, etc.)
# with positive = "in style of Van Gogh, impasto, swirling brushstrokes"
# and unconditional = "photograph, photorealistic, realistic". Target
# and neutral are equal and carry no style descriptor (neutral anchor).
#
# Hyperparameters:
#   - guidance_scale: 4 (matches the upstream Concept Sliders paper)
#   - resolution: 512
#   - rank/alpha/method: rank 16, xattn, alpha 1 (Flux adaptation)
# ============================================================

- target: "a landscape"
  positive: "a landscape in the style of Van Gogh, impasto, swirling brushstrokes, vibrant colors, post-impressionist painting"
  unconditional: "a landscape, photograph, photorealistic, realistic"
  neutral: "a landscape"
  guidance_scale: 4
  resolution: 512

- target: "a portrait of a person"
  positive: "a portrait of a person in the style of Van Gogh, impasto, expressive brushstrokes, post-impressionist"
  unconditional: "a portrait of a person, photograph, photorealistic, realistic"
  neutral: "a portrait of a person"
  guidance_scale: 4
  resolution: 512

